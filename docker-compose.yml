networks:
  default:
    name: veganverse

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veganfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veganfit}
      POSTGRES_DB: ${POSTGRES_DB:-veganfit}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veganfit}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../vegan-backend
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        EXPOSE 4000
    working_dir: /app
    volumes:
      - ../vegan-backend:/app
      # Plain bind mount, not a named volume — deliberately, see .docker-data/README.md
      - ./.docker-data/backend-node_modules:/app/node_modules
    environment:
      # Overrides only — everything else (JWT_SECRET, SMTP_*, CLOUDINARY_*, ANTHROPIC_API_KEY, ...)
      # is read from vegan-backend/.env by the app itself, since the repo is bind-mounted in.
      DATABASE_URL: postgresql://${POSTGRES_USER:-veganfit}:${POSTGRES_PASSWORD:-veganfit}@postgres:5432/${POSTGRES_DB:-veganfit}
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

  admin:
    build:
      context: ../vegan-Admin
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        EXPOSE 3001
    working_dir: /app
    volumes:
      - ../vegan-Admin:/app
      - ./.docker-data/admin-node_modules:/app/node_modules
      - ./.docker-data/admin-next:/app/.next
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ../VeganFit_Next-Frontend
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        EXPOSE 3000
    working_dir: /app
    volumes:
      - ../VeganFit_Next-Frontend:/app
      - ./.docker-data/frontend-node_modules:/app/node_modules
      - ./.docker-data/frontend-next:/app/.next
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "corepack enable && pnpm install && pnpm dev"
